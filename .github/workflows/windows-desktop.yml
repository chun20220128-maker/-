name: Windows desktop installer
on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/windows-desktop.yml'
      - 'web/**'
      - 'index.html'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: desktop
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: node node_modules/electron/install.js
      - run: npm run prepare-ui
      - run: npm test
      - run: npm run test:desktop
      - name: Build Windows installer
        run: |
          npm run build:win *> build-log.txt
          $code = $LASTEXITCODE
          Get-Content build-log.txt
          if ($code -ne 0) {
            '## Windows installer build error' | Add-Content $env:GITHUB_STEP_SUMMARY
            '```text' | Add-Content $env:GITHUB_STEP_SUMMARY
            Get-Content build-log.txt -Tail 100 | Add-Content $env:GITHUB_STEP_SUMMARY
            '```' | Add-Content $env:GITHUB_STEP_SUMMARY
            throw "Windows installer build failed ($code). See job summary."
          }
      - name: Verify Windows install, installed app, and uninstall
        run: ./scripts/verify-install.ps1
      - run: npm run checksums
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            desktop/dist/CampusFoodWaste-Setup-*-x64.exe
            desktop/dist/SHA256SUMS.txt
            desktop/WINDOWS-INSTALLATION.md
      - name: Publish tested installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "desktop-v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "校園廚餘管理 Windows 單機版 $version" --notes-file WINDOWS-INSTALLATION.md
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          $assets = @(Get-ChildItem dist/CampusFoodWaste-Setup-*-x64.exe | ForEach-Object { $_.FullName })
          $assets += (Resolve-Path dist/SHA256SUMS.txt).Path
          $assets += (Resolve-Path WINDOWS-INSTALLATION.md).Path
          gh release upload $tag @assets --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
